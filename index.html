<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAD Mods</title>
<meta name="description" content="Конструктор модів для гри Ukraine Air Defense: блоки й Python, графіка поверх картинки, файл .uadmod для гри.">
<meta name="theme-color" content="#030807">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Russo+One&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root {
	--bg: #030807;
	--bg2: #06110e;
	--panel: rgba(9, 28, 22, 0.72);
	--line: rgba(120, 255, 200, 0.14);
	--line2: rgba(120, 255, 200, 0.42);
	--neon: #3dffb0;
	--cyan: #6fdcff;
	--amber: #ffc24d;
	--red: #ff5a4a;
	--text: #ecfff6;
	--muted: #9dbfb0;
	--dim: #62877a;
	--display: "Russo One", "Manrope", system-ui, sans-serif;
	--body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
	background: radial-gradient(1200px 600px at 80% -10%, rgba(61, 255, 176, 0.08), transparent 60%), var(--bg);
	color: var(--text); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;
}
a { color: var(--neon); }
button, input, textarea { font: inherit; color: inherit; }
.wrap { width: min(1400px, 100% - 32px); margin: 0 auto; }

/* --- top ----------------------------------------------------------------------------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(3, 8, 7, 0.86); border-bottom: 1px solid var(--line);
	backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font: 19px var(--display); letter-spacing: 1.2px; color: var(--text); text-decoration: none; white-space: nowrap; }
.brand img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 16px rgba(61, 255, 176, 0.35); }
.brand b { color: var(--neon); font-weight: 400; }
.top .spacer { flex: 1; }
.top .game { color: var(--muted); font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; }
.top .game:hover { color: var(--text); }
.lang { display: flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; color: var(--muted); font: 700 12px var(--body); padding: 6px 11px; cursor: pointer; letter-spacing: 0.6px; }
.lang button.on { background: var(--neon); color: #01140c; }

/* --- head and mod details ---------------------------------------------------------------- */
.intro { padding: 22px 0 8px; }
.intro h1 { font: 30px/1.15 var(--display); margin: 0 0 6px; letter-spacing: 0.5px; }
.intro p { margin: 0; color: var(--muted); max-width: 820px; }
.meta { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.5fr); gap: 10px; margin: 16px 0 10px; }
.meta label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.7px; }
.meta .wide { grid-column: 1 / -1; }
.meta input, .meta textarea { background: rgba(2, 12, 9, 0.85); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; font-size: 15px;
	text-transform: none; letter-spacing: 0; font-weight: 500; outline: none; width: 100%; min-width: 0; }
.meta input:focus, .meta textarea:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(61, 255, 176, 0.15); }
.meta textarea { resize: vertical; min-height: 42px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.btn { border: 1px solid var(--line2); background: rgba(10, 40, 30, 0.7); border-radius: 10px; padding: 9px 15px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--neon); }
.btn.main { background: linear-gradient(135deg, #3dffb0, #1fd28a); color: #01180d; border-color: transparent; box-shadow: 0 0 22px rgba(61, 255, 176, 0.28); }
.btn.main:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--neon); width: 16px; height: 16px; }
#saved { color: var(--neon); font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
#saved.show { opacity: 1; }
#saved:not(.show) { display: none; }

/* --- tabs ---------------------------------------------------------------------------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; font-weight: 800; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--neon); }
.pane { padding: 12px 0 28px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-weight: 700; font-size: 14px; }
.bar .spacer { flex: 1; }
#blockly { height: calc(100vh - 290px); min-height: 460px; border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; }
#pane-blocks.muted #blockly { opacity: 0.45; }
.blocklyToolboxDiv { padding-top: 6px; }
.blocklyTreeRow { border-radius: 8px; margin: 2px 6px !important; height: 30px !important; line-height: 30px !important; }
.blocklyTreeLabel { font: 700 13px var(--body) !important; }

/* code */
.note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: rgba(255, 194, 77, 0.1); border: 1px solid rgba(255, 194, 77, 0.45);
	color: var(--amber); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; font-weight: 700; font-size: 14px; }
#code .CodeMirror { height: calc(100vh - 320px); min-height: 420px; border: 1px solid var(--line2); border-radius: 14px; font: 14px/1.6 var(--mono);
	background: #020c09; color: #d8f5e8; }
.CodeMirror-gutters { background: #04130e; border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: #3f6b5c; }
.CodeMirror-cursor { border-left-color: var(--neon); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(61, 255, 176, 0.18); }
.cm-keyword { color: #ff8ca8; } .cm-def { color: #7fd0ff; } .cm-builtin { color: #9fc4ff; } .cm-string { color: #ffe08a; }
.cm-number { color: #ffb86b; } .cm-comment { color: #5f8a7a; font-style: italic; } .cm-variable { color: #d8f5e8; } .cm-property { color: #8dffcc; }
.cm-meta { color: #ffc24d; } .cm-operator { color: #b9e6d4; } .cm-variable-2 { color: #c8ffe6; }

/* picture */
.pic { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.pic > div { min-width: 0; }
.pic h2 { font: 20px var(--display); margin: 0 0 4px; }
.fx { border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; background: var(--panel); }
.fx.on { border-color: var(--line2); }
.fx-head { display: flex; align-items: center; gap: 6px; font-weight: 800; cursor: pointer; }
.fx-head input, .fx-opt input { accent-color: var(--neon); width: 16px; height: 16px; }
.fx-slider, .fx-opt { display: none; align-items: center; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.fx.on .fx-slider, .fx.on .fx-opt { display: flex; }
.fx-slider input { flex: 1; accent-color: var(--neon); }
.fx-slider output { width: 40px; text-align: right; font: 12px var(--mono); color: var(--text); }
.fx input[type=color] { display: none; margin-top: 6px; width: 60px; height: 30px; border: 1px solid var(--line2); border-radius: 6px; background: none; }
.fx.on input[type=color] { display: block; }
.preview-box { position: sticky; top: 76px; }
#preview { width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; border: 1px solid var(--line2); background: #000; display: block; }
.preview-opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 10px 0; }
#pic-code { background: #020c09; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 12.5px/1.55 var(--mono); color: #cfeee0;
	max-height: 300px; overflow: auto; white-space: pre; margin: 8px 0 0; }
.warn { color: var(--amber); font-size: 14px; }

/* help */
.help { max-width: 860px; }
.help h2 { font: 24px var(--display); margin: 6px 0 12px; }
.help ol { padding-left: 22px; margin: 0 0 16px; }
.help li { margin: 0 0 10px; }
.help .rule { border-left: 3px solid var(--amber); padding: 6px 12px; color: var(--muted); background: rgba(255, 194, 77, 0.06); border-radius: 0 10px 10px 0; }
.help code { font: 13px var(--mono); background: rgba(61, 255, 176, 0.1); padding: 1px 6px; border-radius: 5px; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; transition: 0.3s; z-index: 50;
	background: #0b2a20; border: 1px solid var(--neon); color: var(--text); border-radius: 12px; padding: 11px 18px; max-width: min(640px, 100% - 32px);
	box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); font-weight: 600; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#toast.bad { border-color: var(--red); }

@media (max-width: 860px) {
	.meta { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
	.meta label:first-child { grid-column: 1 / -1; }
	.pic { grid-template-columns: minmax(0, 1fr); }
	.preview-box { position: static; order: -1; }
	.top .game { display: none; }
	.intro h1 { font-size: 24px; }
	#blockly { height: calc(100vh - 220px); min-height: 420px; }
}
@media (max-width: 520px) {
	.brand span { display: none; }
}
</style>
</head>
<body>
<header class="top">
	<div class="wrap">
		<a class="brand" href="./"><img src="img/icon.png" alt=""><span>UAD <b>Mods</b></span></a>
		<div class="spacer"></div>
		<a class="game" href="https://mikeliashenko.github.io/UAD/" data-t="to_game"></a>
		<div class="lang" role="group" aria-label="Language">
			<button data-lang="uk">UA</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
		</div>
	</div>
</header>

<main class="wrap">
	<section class="intro">
		<h1 data-t="title"></h1>
		<p data-t="lead"></p>
	</section>

	<section class="meta">
		<label><span data-t="mod_name"></span><input id="m-name" maxlength="48" data-ph="mod_name_ph"></label>
		<label><span data-t="mod_author"></span><input id="m-author" maxlength="48"></label>
		<label><span data-t="mod_version"></span><input id="m-version" maxlength="16" value="1.0"></label>
		<label class="wide"><span data-t="mod_desc"></span><textarea id="m-desc" rows="1" maxlength="600" data-ph="mod_desc_ph"></textarea></label>
	</section>

	<div class="actions">
		<button class="btn main" id="btn-download" data-t="download"></button>
		<button class="btn" id="btn-open" data-t="open"></button>
		<input type="file" id="file" accept=".uadmod,application/zip" hidden>
		<label class="check"><input type="checkbox" id="with-pic" checked><span data-t="with_picture"></span></label>
		<span id="saved" data-t="saved"></span>
	</div>

	<nav class="tabs">
		<button data-tab="blocks" data-t="tab_blocks"></button>
		<button data-tab="code" data-t="tab_code"></button>
		<button data-tab="picture" data-t="tab_picture"></button>
		<button data-tab="help" data-t="tab_help"></button>
	</nav>

	<section class="pane" id="pane-blocks">
		<div class="bar">
			<span data-t="examples"></span>
			<button class="btn small" data-example="weapon" data-t="ex_weapon"></button>
			<button class="btn small" data-example="enemy" data-t="ex_enemy"></button>
			<button class="btn small" data-example="streak" data-t="ex_streak"></button>
			<button class="btn small" data-example="night" data-t="ex_night"></button>
			<span class="spacer"></span>
			<button class="btn small" id="btn-clear" data-t="clear"></button>
		</div>
		<div id="blockly"></div>
	</section>

	<section class="pane" id="pane-code" hidden>
		<p class="note" id="code-note" data-t="code_note"></p>
		<div class="banner" id="detached" hidden><span data-t="code_detached"></span><button class="btn small" id="btn-back" data-t="back_to_blocks"></button></div>
		<div id="code"></div>
	</section>

	<section class="pane" id="pane-picture" hidden>
		<div class="pic">
			<div>
				<h2 data-t="pic_title"></h2>
				<p class="note" data-t="pic_lead"></p>
				<div id="fx"></div>
			</div>
			<div class="preview-box">
				<canvas id="preview" width="1280" height="720"></canvas>
				<p class="warn" id="no-webgl" hidden data-t="no_webgl"></p>
				<div class="preview-opts">
					<label class="check"><input type="checkbox" id="prev-night" checked><span data-t="pic_night"></span></label>
					<label class="check"><input type="checkbox" id="prev-alarm"><span data-t="pic_alarm"></span></label>
					<span class="spacer"></span>
					<button class="btn" id="btn-pic" data-t="pic_download"></button>
				</div>
				<div class="note" data-t="pic_code"></div>
				<pre id="pic-code"></pre>
			</div>
		</div>
	</section>

	<section class="pane help" id="pane-help" hidden>
		<h2 data-t="help_title"></h2>
		<ol id="help-steps"></ol>
		<p class="rule" data-t="help_rules"></p>
	</section>
</main>
<div id="toast"></div>

<script src="https://unpkg.com/blockly@11.2.1/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/python_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/msg/en.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/blocks.js"></script>
<script src="js/shader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
